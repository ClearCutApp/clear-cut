openapi: 3.1.0

info:
  title: ClearCut API
  version: 1.1.0
  summary: Agentic script clearance for independent film production.
  description: |
    Upload a screenplay version and every rights event that could stop the film
    comes back with the law it triggers, who holds the rights, and an action to
    resolve it.

    Live requests require a verified Firebase identity and explicit project grants.
    POST /api/projects requires organization_id in live mode; legacy data is quarantined.
    This document is the contract, not a description of what is deployed today.
    Four verticals build against it in parallel, so a field named here is the
    field they each implement.

    Two rules hold everywhere:

    - Analysis is asynchronous. `POST /api/projects/{project_id}/scripts`
      answers 202 with an analysis id and a `Location` header. Document AI and
      Gemini take minutes on a feature-length script, which outlives the Cloud
      Run request timeout. The browser polls
      `GET /api/projects/{project_id}/analyses/{analysis_id}` instead.
    - Every path is scoped to its project. There is no top-level
      `/api/tracker-items/...`: an item id alone leaves the server unable to
      answer "may this caller read it" without a second lookup.

    `GET /api/health` reports whether this instance serves real analysis or the
    fixed demo sample. Check it before trusting a finding.

servers:
  - url: /
    description: The service serving this document.

tags:
  - name: System
    description: Liveness and the machine-readable description of this API.
  - name: Projects
    description: Projects and the jurisdictions they can be cleared against.
  - name: Scripts
    description: Script uploads, script versions, and the analyses they queue.
  - name: Tracker
    description: The actionable side of a finding, and the actions taken on it.
  - name: Bible
    description: Project bible facts that continuity and policy audits run against.
  - name: Questions
    description: Grounded questions about one project's clearance state.

security:
  - FirebaseIdentity: []

paths:
  /api/client-config:
    get:
      tags: [System]
      operationId: getClientConfig
      security: []
      summary: Public Firebase web app identifiers
      responses:
        '200':
          description: Public app config.
          content:
            application/json:
              schema:
                type: object
                required: [apiKey, authDomain, projectId, appId]
                properties:
                  apiKey: {type: string}
                  authDomain: {type: string}
                  projectId: {type: string}
                  appId: {type: string}
        '503': {description: Account access is awaiting configuration.}
  /api/organizations:
    get:
      tags: [Projects]
      operationId: listOrganizations
      summary: Active memberships of this user
      responses:
        '200':
          description: Workspaces.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Organization'}
    post:
      tags: [Projects]
      operationId: createOrganization
      summary: Create a private workspace and owner membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1}
      responses:
        '201':
          description: Workspace.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
  /api/me:
    get:
      tags: [System]
      operationId: getIdentity
      summary: Verified identity context
      responses:
        '200':
          description: Verified user.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, email]
                properties:
                  user_id: {type: string}
                  email: {type: string}
        '401': {description: Sign in required.}
        '503': {description: Identity or authorization service unavailable.}
  /api/health:
    get:
      security: []
      tags: [System]
      operationId: getHealth
      summary: Whether this instance runs live or serves the demo sample
      description: |
        `mock` means every scene, finding and tracker item came from the planted
        scenario rather than from a real analysis.
      responses:
        '200':
          description: The mode this instance runs under.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/openapi.json:
    get:
      security: []
      tags: [System]
      operationId: getOpenApiDocument
      summary: This document, as JSON, from the running service
      responses:
        '200':
          description: An OpenAPI document describing the routes this instance serves.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          $ref: '#/components/responses/InternalError'

  /api/docs:
    get:
      security: []
      tags: [System]
      operationId: getApiDocs
      summary: Swagger UI over the document above
      responses:
        '200':
          description: An HTML page.
          content:
            text/html:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'

  /api/jurisdictions:
    get:
      security: []
      tags: [Projects]
      operationId: listJurisdictions
      summary: The jurisdictions a project can be cleared against
      description: |
        The selectable codes `jurisdiction_code` accepts anywhere in this API. A
        jurisdiction's legal corpus prefix is deliberately absent: it names a
        bucket layout, which is the server's business.
      responses:
        '200':
          description: Every supported jurisdiction, in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Jurisdiction'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: Every project
      responses:
        '200':
          description: The projects this instance holds. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: The project as stored. `Location` carries its canonical path.
          headers:
            Location:
              description: The path of the created project.
              required: true
              schema:
                type: string
                examples: ['/api/projects/prj-4f2a']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: One project
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{project_id}/script-files:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Scripts]
      operationId: uploadScriptFile
      summary: Upload a screenplay PDF and get back the URI to analyze
      description: |
        Writes the PDF to Cloud Storage and returns its `gs://` URI. Nothing is
        parsed here: pass the returned `gcs_uri` to
        `POST /api/projects/{project_id}/scripts` to queue an analysis. The two
        steps are separate so a re-analysis of the same upload costs no second
        transfer.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: A PDF, at most 25 MiB.
            encoding:
              file:
                contentType: application/pdf
      responses:
        '201':
          description: The stored object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptFile'
        '400':
          description: |
            No file part, or a file that is not a PDF. ClearCut reads screenplays
            through Document AI, which is configured for PDF alone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The file is over 25 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Cloud Storage rejected the write. Nothing was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{project_id}/scripts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Scripts]
      operationId: listScripts
      summary: Every version of this project's script
      responses:
        '200':
          description: |
            One entry per version, newest first. Scenes and findings are absent
            here; read one version to get them.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScriptSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Scripts]
      operationId: createScript
      summary: Queue an analysis of one script version
      description: |
        Answers 202 and returns immediately. `version` of 1 runs the full
        pipeline; greater than 1 runs the delta path, re-analyzing only the
        scenes whose content hash changed against the stored previous version.

        Poll the `Location` path until `state` leaves `QUEUED` and `RUNNING`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptCreate'
      responses:
        '202':
          description: |
            The analysis was queued. The script itself does not exist yet, so
            `Location` points at the analysis rather than at the script.
          headers:
            Location:
              description: The path to poll for this analysis.
              required: true
              schema:
                type: string
                examples: ['/api/projects/prj-4f2a/analyses/ana-91c3']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No such project, or `version` above 1 with no stored previous version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{project_id}/scripts/{script_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ScriptId'
    get:
      tags: [Scripts]
      operationId: getScript
      summary: One script version, with its scenes, spans and findings
      description: |
        Each scene carries a `spans` array: the character offsets in that
        scene's `text` that a finding was raised against. The server computes
        them while it reads the script, so a highlight is an offset the browser
        renders rather than a substring it searches for -- the same phrase can
        appear twice in a scene and only one occurrence be the finding.
      responses:
        '200':
          description: The script version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Script'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{project_id}/analyses/{analysis_id}:
    parameters:
    - name: project_id
      in: path
      required: true
      description: The project that owns the record.
      schema:
        type: string
        minLength: 1
    - name: analysis_id
      in: path
      required: true
      description: One queued analysis, as returned by the 202 that created it.
      schema:
        type: string
        minLength: 1
    get:
      tags:
      - Scripts
      operationId: getAnalysis
      summary: The state of one queued analysis
      description: |
        `SUCCEEDED` carries the `script_id` to read. `FAILED` carries a
        non-empty `error`. A run whose instance was reclaimed mid-run is
        reported as `FAILED` by the read that finds it stale, so a job never
        sits in `RUNNING` forever.
      responses:
        '200':
          description: The analysis job at its newest version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '404':
          description: No record at this path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The server failed for a reason it does not attribute. The body carries a message
            and never a stack trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{project_id}/tracker-items:
    parameters:
    - name: project_id
      in: path
      required: true
      description: The project that owns the record.
      schema:
        type: string
        minLength: 1
    get:
      tags:
      - Tracker
      operationId: listTrackerItems
      summary: This project's tracker items
      responses:
        '200':
          description: |
            One entry per item, at its newest version. An empty array when the
            project has no items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrackerItem'
        '404':
          description: No record at this path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The server failed for a reason it does not attribute. The body carries a message
            and never a stack trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{project_id}/tracker-items/{item_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ItemId'
    get:
      tags:
      - Tracker
      operationId: getTrackerItem
      summary: One tracker item
      responses:
        '200':
          description: The item at its newest version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackerItem'
        '404':
          description: No record at this path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The server failed for a reason it does not attribute. The body carries a message
            and never a stack trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Tracker
      operationId: updateTrackerItemState
      summary: Move one item between states
      description: |
        Every ordered pair of states is legal, including back out of `CLEARED`
        and into the state the item already holds. A transition is an audit
        record of what a producer did, not a cache of where the item stands, so
        each one writes a new version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackerItemStateUpdate'
      responses:
        '200':
          description: The item at its new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackerItem'
        '400':
          description: Missing or unrecognized `state`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No record at this path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{project_id}/tracker-items/{item_id}/email-drafts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags:
      - Tracker
      operationId: createTrackerItemEmailDraft
      summary: Draft the outreach email for one item
      description: |
        Fills the outreach template from the item's rights holder, contact and
        required document, and stores it on the item as `draft_email`. The
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackerExpectedVersion'
        document, and stores it on the item as `draft_email`. The system never sends it: a producer
        copies the draft and sends it themselves.'
      responses:
        '201':
          description: The item at its new version, carrying the draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackerItem'
        '404':
          description: No record at this path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{project_id}/tracker-items/{item_id}/notifications:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags:
      - Tracker
      operationId: createTrackerItemNotification
      summary: Notify the producer about one item
      description: Posts the item and the reason to the configured outbound webhook.
        explicit project binding; private reason text remains in-app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreate'
      responses:
        '201':
          description: The item at its new version. The webhook accepted the notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackerItem'
        '400':
          description: |
            `reason` is missing, blank, or whitespace only. A notification with
            no reason tells the producer nothing an unsent one would not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: The webhook rejected the notification. Nothing was recorded.
          description: Notification storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The server failed for a reason it does not attribute. The body carries a message
            and never a stack trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{project_id}/bible:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Bible]
      operationId: getProjectBible
      summary: This project's bible
      responses:
        '200':
          description: The bible, with an empty `facts` array when nothing has been recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBible'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{project_id}/bible/facts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Bible]
      operationId: createBibleFact
      summary: Record one bible fact
      description: |
        The server assigns `fact_id` as the next `FACT-NNN` in the project's
        sequence. A `LORE` fact feeds the continuity audit; a `POLICY` fact
        feeds the policy audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BibleFactCreate'
      responses:
        '201':
          description: The fact as stored, carrying the id the server assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleFact'
        '400':
          description: |
            `text` or `source` is missing, blank, or whitespace only. A fact
            with no source cannot be cited, and a citation is what makes an
            audit finding answerable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{project_id}/questions:
            no supported jurisdiction.'
  /api/projects/{project_id}/draft:
    get:
      tags:
      - Screenplay editor
      operationId: getDraft
      summary: getDraft
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Saved document or immutable revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenplayDraft'
        '400':
          description: Invalid document or expected version
        '401':
          description: Verified identity required
        '404':
          description: Project or revision inaccessible
        '409':
          description: Draft changed; response includes current_version. Preserve local
            edits before reloading.
    put:
      tags:
      - Screenplay editor
      operationId: saveDraft
      summary: saveDraft
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Saved document or immutable revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenplayDraft'
        '400':
          description: Invalid document or expected version
        '401':
          description: Verified identity required
        '404':
          description: Project or revision inaccessible
        '409':
          description: Draft changed; response includes current_version. Preserve local
            edits before reloading.
      requestBody:
        required: true
        description: Canonical screenplay JSON is limited to 8 MiB; block IDs unique
          and scene IDs stable.
        content:
          application/json:
            schema:
              type: object
              required:
              - document
              properties:
                  type: integer
                  minimum: 0
                document:
  /api/projects/{project_id}/revisions:
    get:
      tags:
      - Screenplay editor
      operationId: listRevisions
      summary: listRevisions
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: before_version
        in: query
        schema:
          type: integer
          minimum: 1
        description: Exclusive cursor; at most 50 revisions per page.
      responses:
        '200':
          description: Saved document or immutable revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionPage'
        '400':
          description: Invalid document or expected version
        '401':
          description: Verified identity required
        '404':
          description: Project or revision inaccessible
        '409':
          description: Draft changed; response includes current_version. Preserve local
            edits before reloading.
    post:
      tags:
      - Screenplay editor
      operationId: freezeRevision
      summary: freezeRevision
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Saved document or immutable revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenplayRevision'
        '400':
          description: Invalid document or expected version
        '401':
          description: Verified identity required
        '404':
          description: Project or revision inaccessible
        '409':
          description: Draft changed; response includes current_version. Preserve local
            edits before reloading.
      requestBody:
        required: true
        description: Canonical screenplay JSON is limited to 8 MiB; block IDs unique
          and scene IDs stable.
        content:
          application/json:
            schema:
              type: object
              required:
              properties:
                  type: integer
                  minimum: 0
  /api/projects/{project_id}/revisions/{revision_id}:
    get:
      tags:
      - Screenplay editor
      operationId: getRevision
      summary: getRevision
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Saved document or immutable revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenplayRevision'
        '400':
          description: Invalid document or expected version
        '401':
          description: Verified identity required
        '404':
          description: Project or revision inaccessible
        '409':
          description: Draft changed; response includes current_version. Preserve local
            edits before reloading.

  /api/projects/{project_id}/transcriptions:
    post:
      tags:
      operationId: transcribeQuestion
      summary: Transcribe a recording for review
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - audio
              - language
              properties:
                audio:
                  type: string
                  format: binary
                language:
                  enum:
                  - en-US
                  - es-419
                  - es-ES
      responses:
        '200':
          description: Editable transcript; audio not stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
        '400':
          description: Empty, invalid or unsupported recording/language; maximum 60
            seconds
        '413':
          description: Audio exceeds 8 MiB
        '503':
          description: Speech is not available in this environment

  /api/projects/{project_id}/documents:
          description: Owned immutable file or saved screenplay
          description: Draft changed; original retained in project documents
          description: Owned immutable file or saved screenplay
          description: Draft changed; original retained in project documents
  /api/projects/{project_id}/documents/{file_id}:
