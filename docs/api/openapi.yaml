components:
  securitySchemes:
    FirebaseIdentity:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: Required in live mode; mock is an isolated public demo.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: The project that owns the record.
      schema:
        type: string
        minLength: 1
        examples: ['prj-4f2a']

    ScriptId:
      name: script_id
      in: path
      required: true
      description: One script version.
      schema:
        type: string
        minLength: 1
        examples: ['scr-77b1']

    AnalysisId:
      name: analysis_id
      in: path
      required: true
      description: One queued analysis, as returned by the 202 that created it.
      schema:
        type: string
        minLength: 1
        examples: ['ana-91c3']

    ItemId:
      name: item_id
      in: path
      required: true
      description: One tracker item.
      schema:
        type: string
        minLength: 1
        examples: ['itm-0031']

  responses:
    BadRequest:
      description: A required field is missing or invalid. Nothing was written.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: No record at this path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: |
        The server failed for a reason it does not attribute. The body carries a
        message and never a stack trace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Organization:
      type: object
      required: [organization_id, name, role]
      properties:
        organization_id: {type: string}
        name: {type: string}
        role: {type: string}
    Error:
      type: object
      description: The one error shape every failing response returns.
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, in one sentence, safe to show a producer.
          examples: ['gcs_uri is required']
      additionalProperties: false

    Health:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [mock, live]
          description: |
            `mock` serves the planted demo scenario; `live` runs real analysis.
      additionalProperties: false

    Jurisdiction:
      type: object
      required: [code, display_name]
      properties:
        code:
          type: string
          description: The ISO 3166-1 alpha-2 code every `jurisdiction_code` field takes.
          examples: ['AR']
        display_name:
          type: string
          examples: ['Argentina']
      additionalProperties: false

    ProjectCreate:
      type: object
      required: [title, jurisdiction_code]
      properties:
        organization_id:
          type: string
          description: Required in live mode.
        title:
          type: string
          minLength: 1
          examples: ['El Ultimo Verano']
        jurisdiction_code:
          type: string
          description: One of the codes `GET /api/jurisdictions` returns.
          examples: ['AR']
        poster_uri:
          $ref: '#/components/schemas/ProjectPosterUri'
        format:
          $ref: '#/components/schemas/ProjectFormat'
        status:
          $ref: '#/components/schemas/ProjectStatus'
      additionalProperties: false

    ProjectFormat:
      type: [string, 'null']
      enum: [documentary, feature_film, series, short, null]
      description: >
        What kind of production this is. `null` means nobody has said; a client
        shows nothing rather than guessing one.
      examples: ['feature_film']

    ProjectStatus:
      type: [string, 'null']
      enum: [completed, in_development, in_production, null]
      description: Where the production has reached. `null` means nobody has said.
      examples: ['in_development']

    ProjectPosterUri:
      type: [string, 'null']
      description: >
        Where this project's poster art lives. `null` when none has been set,
        which is the default: the server never invents one, and a client draws
        whatever placeholder it likes rather than a poster this project does not
        have. Nothing in this API uploads or fetches the image.
      examples: ['gs://clearcut-posters/prj-4f2a.jpg']

    Project:
      type: object
      required:
        - project_id
        - title
        - jurisdiction_code
        - created_at
        - poster_uri
        - format
        - status
        - favourite
      properties:
        project_id:
          type: string
          examples: ['prj-4f2a']
        title:
          type: string
          examples: ['El Ultimo Verano']
        jurisdiction_code:
          type: string
          examples: ['AR']
        created_at:
          type: string
          format: date-time
          description: UTC, seconds precision.
          examples: ['2026-09-05T12:00:00Z']
        poster_uri:
          $ref: '#/components/schemas/ProjectPosterUri'
        format:
          $ref: '#/components/schemas/ProjectFormat'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        favourite:
          type: boolean
          description: >
            Whether the caller has marked this project. Per user, never per
            project: two producers reading the same project see two answers.
      additionalProperties: false

    ProjectFavourite:
      type: object
      required: [project_id, favourite]
      properties:
        project_id:
          type: string
        favourite:
          type: boolean
      additionalProperties: false

    ScriptFile:
      type: object
      description: One uploaded screenplay in Cloud Storage.
      required: [gcs_uri, filename, size_bytes, content_type]
      properties:
        file_id:
          type: string
          description: Owned upload ID; required for live analysis.
        gcs_uri:
          type: string
          description: Pass this to `POST /api/projects/{project_id}/scripts`.
          examples: ['gs://clearcut-scripts/prj-4f2a/el-ultimo-verano-v2.pdf']
        filename:
          type: string
          examples: ['el-ultimo-verano-v2.pdf']
        size_bytes:
          type: integer
          minimum: 1
          examples: [2411553]
        content_type:
          type: string
          enum: [application/pdf]
      additionalProperties: false

    ScriptCreate:
      type: object
      required:
      - jurisdiction_code
      description: Live analysis requires revision_id. Mock mode retains gcs_uri and version.
      properties:
        revision_id:
          type: string
          description: Immutable saved revision in this project; required in live mode.
        file_id:
          type: string
          description: Owned upload ID; required for live analysis.
        gcs_uri:
          type: string
          description: The URI `POST /api/projects/{project_id}/script-files` returned.
        version:
          type: integer
          minimum: 1
          description: 1 runs the full pipeline. Above 1 diffs against the stored previous version and
            re-analyzes only the scenes whose content hash changed.
        jurisdiction_code:
          type: string
      additionalProperties: false

    AnalysisState:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - SUCCEEDED
      - FAILED
      - CANCELLED
      description: '`SUCCEEDED` and `FAILED` are terminal: a job in either never moves again, and a later
        run of the same script is a new analysis.'

    AnalysisJob:
      type: object
      required:
      - analysis_id
      - project_id
      - script_id
      - state
      - created_at
      - updated_at
      - error
      - version
      properties:
        revision_id:
          type: string
        stage:
          type: string
        attempt:
          type: integer
        cancel_requested:
          type: boolean
        analysis_id:
          type: string
        project_id:
          type: string
        script_id:
          type: string
          description: The script version this analysis produces. Assigned when the job is queued, readable
            at `/api/projects/{project_id}/scripts/{script_id}` once `state` is `SUCCEEDED`.
        state:
          $ref: '#/components/schemas/AnalysisState'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When this version was written. Polling compares it to spot a stalled run.
        error:
          type: string
          description: Why the run failed. Empty in every state but `FAILED`, and never empty in `FAILED`.
        version:
          type: integer
          minimum: 1
          description: Each transition writes a new version rather than mutating this row.
      additionalProperties: false

    ClearanceReport:
      type: object
      required:
      - report_id
      - analysis_id
      - revision_id
      - generation_id
      - clearance_epoch
      - created_at
      - counts
      properties:
        report_id:
          type: string
        project_id:
          type: string
        analysis_id:
          type: string
        revision_id:
          type: string
        generation_id:
          type: string
        created_at:
          type: string
        created_by:
          type: string
        language:
          type: string
        formula_version:
          type: string
        template_version:
          type: string
        clearance_epoch:
          type: integer
        counts:
          type: object

    ActivityEvent:
      type: object
      required:
      - event_id
      - kind
      - occurred_at
      - payload
      properties:
        event_id:
          type: string
        kind:
          type: string
        occurred_at:
          type: string
          format: date-time
        source_version:
          type: integer
        payload:
          type: object

    LocalResearchCreate:
      type: object
      required:
      - expected_settings_version
      - location_index
      - question
      properties:
        expected_settings_version:
          type: integer
          minimum: 1
        location_index:
          type: integer
          minimum: 0
        question:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false

    ProjectSearch:
      type: object
      required:
      - query
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 200
        cursor:
          type: string
          maxLength: 512

    ScriptSummary:
      type: object
      description: One script version without its scenes or findings.
      required:
        [script_id, project_id, version, gcs_uri, jurisdiction_code, scene_count, finding_count]
      properties:
        script_id:
          type: string
          examples: ['scr-77b1']
        project_id:
          type: string
          examples: ['prj-4f2a']
        version:
          type: integer
          minimum: 1
          examples: [2]
        gcs_uri:
          type: string
          examples: ['gs://clearcut-scripts/prj-4f2a/el-ultimo-verano-v2.pdf']
        jurisdiction_code:
          type: string
          examples: ['AR']
        scene_count:
          type: integer
          minimum: 0
          examples: [84]
        finding_count:
          type: integer
          minimum: 0
          examples: [31]
      additionalProperties: false

    Script:
      type: object
      description: One script version, with every scene and every finding raised against it.
      required:
      - script_id
      - project_id
      - version
      - gcs_uri
      - jurisdiction_code
      - scenes
      - findings
      properties:
        revision_id:
          type: string
        revision_draft_version:
          type: integer
        settings_version:
          type:
          - integer
          - 'null'
        scene_anchors:
          type: array
          items:
            type: object
        clearance_bindings:
          type: object
        coverage_gaps:
          type: array
          items:
            type: object
        script_id:
          type: string
        project_id:
          type: string
        version:
          type: integer
          minimum: 1
        gcs_uri:
          type: string
        jurisdiction_code:
          type: string
        scenes:
          type: array
          description: Ordered by `number`, which strictly increases.
          items:
            $ref: '#/components/schemas/Scene'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
      additionalProperties: false

    Scene:
      type: object
      required: [number, heading, page_start, page_end, text, content_hash, spans]
      properties:
        number:
          type: integer
          minimum: 1
          examples: [12]
        heading:
          type: string
          examples: ['INT. BAR NOTTURNO - NIGHT']
        page_start:
          type: integer
          minimum: 1
          examples: [14]
        page_end:
          type: integer
          minimum: 1
          examples: [15]
        text:
          type: string
          description: The scene as written. `spans` offsets index into this string.
        content_hash:
          type: string
          description: |
            SHA-256 of the normalized text. Two versions share a hash when the
            scene did not change, which is what the delta path joins on.
          examples: ['9f2b1c4e5a6d7f80912a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f80']
        spans:
          type: array
          description: |
            Where in `text` this scene's findings were raised, ordered by
            `start` and never overlapping. Empty when the scene raised none, and
            shorter than the scene's finding count when a finding's `raw_text`
            does not appear verbatim.
          items:
            $ref: '#/components/schemas/Span'
      additionalProperties: false

    Span:
      type: object
      description: |
        One finding's position in one scene's text, computed server-side on
        read (ADR 0015). The browser highlights these offsets and never searches
        the text itself.

        A phrase that appears three times in a scene produces three spans, one
        per occurrence. Where two findings claim the same characters, the
        higher-risk one wins the range and the other has no span here; it is
        still listed among the scene's findings.
      required: [scene_number, start, end, finding_id, risk]
      properties:
        scene_number:
          type: integer
          minimum: 1
          description: The scene this span belongs to, repeated so a span survives being moved.
          examples: [12]
        start:
          type: integer
          minimum: 0
          description: Offset of the first character, counted in Unicode code points.
          examples: [412]
        end:
          type: integer
          minimum: 0
          description: Offset one past the last character. Always greater than `start`.
          examples: [431]
        finding_id:
          type: string
          description: The finding this span belongs to.
          examples: ['EVT-014']
        risk:
          $ref: '#/components/schemas/RiskLevel'
      additionalProperties: false

    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
      description: How urgently a finding needs clearance action.

    Category:
      type: string
      enum:
        - INDUSTRIAL_PROPERTY
        - COPYRIGHT_WORKS
        - PERSONALITY_IMAGE
        - INTEGRATED_VISUAL
        - LOCATIONS_PERMITS
        - SPECIAL_SYMBOLS
        - CONTINUITY
        - POLICY
      description: The eight IP categories a finding falls under.

    NerLabel:
      type: string
      enum:
        - BRAND
        - MUSIC_EXISTING
        - MUSIC_ORIGINAL
        - ART_LIT
        - MEDIA_AV
        - TALENT_CHARACTER
        - REAL_PERSON
        - PROPS_DESIGN
        - LOCATION_PRIV
        - LOCATION_PUB
        - SPECIAL_SYMBOL
      description: The eleven tags the extractor emits.

    Citation:
      type: object
      description: One source backing a finding or an answer.
      required: [uri, title, snippet]
      properties:
        uri:
          type: string
          examples: ['https://servicios.infoleg.gob.ar/infolegInternet/anexos/40000-44999/42755/texact.htm']
        title:
          type: string
          examples: ['Ley 11.723, Regimen Legal de la Propiedad Intelectual']
        snippet:
          type: string
      additionalProperties: false

    Finding:
      type: object
      description: One detected clearance event.
      required:
        - finding_id
        - scene_number
        - page
        - raw_text
        - category
        - ner_label
        - risk_level
        - required_document
        - citations
        - contradicts
      properties:
        finding_id:
          type: string
          examples: ['EVT-014']
        scene_number:
          type: integer
          minimum: 1
          examples: [12]
        page:
          type: integer
          minimum: 1
          examples: [14]
        raw_text:
          type: string
          description: The script fragment the finding was raised against.
          examples: ['a Coca-Cola sign flickers above the bar']
        category:
          $ref: '#/components/schemas/Category'
        ner_label:
          description: |
            Null for `CONTINUITY` and `POLICY` findings: those come from the
            bible audit, so nothing in the script text was extracted for them.
          oneOf:
            - $ref: '#/components/schemas/NerLabel'
            - type: 'null'
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        required_document:
          type: string
          description: What must be obtained to clear this finding.
          examples: ['Trademark Use Authorization']
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        contradicts:
          description: |
            The `fact_id` of the bible fact this finding contradicts, on a
            continuity finding. Null on every other kind.
          type: [string, 'null']
          examples: ['FACT-007']
      additionalProperties: false

    TrackerState:
      type: string
      enum:
      - BLOCKED
      - IN_PROGRESS
      - CLEARED
      description: Where a tracker item stands. Every ordered pair is a legal transition.

    TrackerItem:
      type: object
      description: The actionable side of a finding.
      required:
      - item_id
      - project_id
      - finding_id
      - scene_numbers
      - state
      - needs_review
      - required_document
      - contact
      - litigation_posture
      - draft_email
      - note
      - updated_at
      - version
      - clearance_conditions
      - due_date
      - assignee_id
      - evidence_file_ids
      - rights_holder_citations
      properties:
        item_id:
          type: string
        project_id:
          type: string
        finding_id:
          type: string
        scene_numbers:
          type: array
          description: Every scene this item covers. More than one when the same asset was deduplicated
            across scenes.
          minItems: 1
          items:
            type: integer
            minimum: 1
        state:
          $ref: '#/components/schemas/TrackerState'
        needs_review:
          type: boolean
          description: 'A cleared item whose scene changed in a later version. It is neither silently
            kept nor silently dropped: a producer looks at it again.'
        required_document:
          type: string
        contact:
          type: string
          description: The rights holder to reach, as resolved by rights research.
        litigation_posture:
          type: string
          description: What the holder is known to have done about unlicensed use.
        draft_email:
          description: The outreach draft, once `email-drafts` has been posted. Null before that. The
            system never sends it.
          type:
          - string
          - 'null'
        note:
          type: string
          description: Why this item is in the state it is, when a version was written for a reason the
            state alone does not carry. Empty otherwise.
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Each action writes a new version rather than mutating this row.
        clearance_conditions:
          type: string
        due_date:
          type: string
        assignee_id:
          type: string
        evidence_file_ids:
          type: array
          items:
            type: string
        rights_holder_citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
      additionalProperties: false

    TrackerItemStateUpdate:
      type: object
      required:
      - state
      - expected_version
      properties:
        state:
          $ref: '#/components/schemas/TrackerState'
        expected_version:
          type: integer
          minimum: 1
      additionalProperties: false

    NotificationCreate:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the producer is being told, in one sentence.
      additionalProperties: false

    FactKind:
      type: string
      enum: [LORE, POLICY]
      description: |
        `LORE` facts feed the continuity audit; `POLICY` facts feed the policy
        audit.

    BibleFactCreate:
      type: object
      required: [kind, text, source]
      properties:
        kind:
          $ref: '#/components/schemas/FactKind'
        text:
          type: string
          minLength: 1
          examples: ['Mariana has never left the province.']
        source:
          type: string
          minLength: 1
          description: Where the fact comes from, so a finding that cites it can be checked.
          examples: ['bible.pdf p.4']
      additionalProperties: false

    BibleFact:
      type: object
      required: [fact_id, kind, text, source]
      properties:
        fact_id:
          type: string
          description: Assigned by the server as the next `FACT-NNN` in this project.
          examples: ['FACT-007']
        kind:
          $ref: '#/components/schemas/FactKind'
        text:
          type: string
          examples: ['Mariana has never left the province.']
        source:
          type: string
          examples: ['bible.pdf p.4']
      additionalProperties: false

    ProjectBible:
      type: object
      required: [project_id, facts]
      properties:
        project_id:
          type: string
          examples: ['prj-4f2a']
        facts:
          type: array
          description: Every fact recorded for this project. `fact_id` is unique within it.
          items:
            $ref: '#/components/schemas/BibleFact'
      additionalProperties: false

    QuestionCreate:
      type: object
      required:
      - question
      - jurisdiction_code
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
        jurisdiction_code:
          type: string
          description: The corpus the answer is grounded in.
      additionalProperties: false

    QuestionAnswer:
      type: object
      required:
      - text
      - facts
      - citations
      properties:
        text:
          type: string
          description: The answer.
        facts:
          type: array
          description: The project bible facts the answer drew on. Empty when it drew on none.
          items:
            $ref: '#/components/schemas/BibleFact'
        citations:
          type: array
          description: Supporting legal sources or exact saved-revision scene references.
          items:
            $ref: '#/components/schemas/Citation'
      additionalProperties: false

    ScreenplayDocument:
      type: object
      required:
      - type
      - content
      properties:
        type:
          const: doc
        content:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: object
            required:
            - type
            - attrs
            properties:
              type:
                const: paragraph
              attrs:
                type: object
                required:
                - blockId
                - sceneId
                - kind
                properties:
                  blockId:
                    type: string
                    minLength: 1
                    maxLength: 128
                  sceneId:
                    type: string
                    minLength: 1
                    maxLength: 128
                  kind:
                    enum:
                    - scene-heading
                    - action
                    - character
                    - dialogue
                    - parenthetical
                    - transition
              content:
                type: array
                items:
                  type: object
                  required:
                  - type
                  properties:
                    type:
                      enum:
                      - text
                      - hardBreak
                    text:
                      type: string
                    marks:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            enum:
                            - bold
                            - italic
    ScreenplayDraft:
      type: object
      required:
      - project_id
      - version
      - document
      - updated_at
      - updated_by
      properties:
        project_id:
          type: string
        version:
          type: integer
          minimum: 0
        document:
          anyOf:
          - $ref: '#/components/schemas/ScreenplayDocument'
          - type: 'null'
        updated_at:
          type: string
        updated_by:
          type: string
    ScreenplayRevision:
      type: object
      required:
      - revision_id
      - project_id
      - draft_version
      - sha256
      - created_at
      - created_by
      properties:
        revision_id:
          type: string
        project_id:
          type: string
        draft_version:
          type: integer
        sha256:
          type: string
        created_at:
          type: string
        created_by:
          type: string
        document:
          $ref: '#/components/schemas/ScreenplayDocument'
    RevisionPage:
      type: object
      required:
      - revisions
      - next_before_version
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/ScreenplayRevision'
        next_before_version:
          type:
          - integer
          - 'null'
    Transcription:
      type: object
      required:
      - text
      - language
      properties:
        text:
          type: string
        language:
          enum:
          - en-US
          - es-419
          - es-ES
    ProjectDocument:
      type: object
      required:
      - file_id
      - organization_id
      - project_id
      - filename
      - content_type
      - sha256
      - kind
      - created_by
      - created_at
      - revision_id
      - size_bytes
      properties:
        file_id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        sha256:
          type: string
        kind:
          type: string
        created_by:
          type: string
        created_at:
          type: string
        revision_id:
          type: string
        size_bytes:
          type: integer
          minimum: 1
    DocumentPage:
      type: object
      required:
      - documents
      - next_before
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDocument'
        next_before:
          type:
          - string
          - 'null'
    ScreenplayImportResult:
      type: object
      required:
      - draft
      - original
      - warnings
      properties:
        draft:
          $ref: '#/components/schemas/ScreenplayDraft'
        original:
          $ref: '#/components/schemas/ProjectDocument'
        warnings:
          type: array
          items:
            type: string

    TrackerExpectedVersion:
      type: object
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 1
      additionalProperties: false

    ClearanceDetailsUpdate:
      type: object
      required:
      - expected_version
      - note
      - clearance_conditions
      - due_date
      - assignee_id
      - evidence_file_ids
      - draft_email
      properties:
        expected_version:
          type: integer
          minimum: 1
        note:
          type: string
          maxLength: 4000
        clearance_conditions:
          type: string
          maxLength: 4000
        due_date:
          type: string
          description: YYYY-MM-DD or empty to remove the deadline.
        assignee_id:
          type: string
          maxLength: 128
        evidence_file_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        draft_email:
          type:
          - string
          - 'null'
          maxLength: 20000
      additionalProperties: false
