components:
  securitySchemes:
    FirebaseIdentity:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: Required in live mode; mock is an isolated public demo.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: The project that owns the record.
      schema:
        type: string
        minLength: 1
        examples: ['prj-4f2a']

    ScriptId:
      name: script_id
      in: path
      required: true
      description: One script version.
      schema:
        type: string
        minLength: 1
        examples: ['scr-77b1']

    AnalysisId:
      name: analysis_id
      in: path
      required: true
      description: One queued analysis, as returned by the 202 that created it.
      schema:
        type: string
        minLength: 1
        examples: ['ana-91c3']

    ItemId:
      name: item_id
      in: path
      required: true
      description: One tracker item.
      schema:
        type: string
        minLength: 1
        examples: ['itm-0031']

  responses:
    BadRequest:
      description: A required field is missing or invalid. Nothing was written.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: No record at this path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: |
        The server failed for a reason it does not attribute. The body carries a
        message and never a stack trace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Organization:
      type: object
      required: [organization_id, name, role]
      properties:
        organization_id: {type: string}
        name: {type: string}
        role: {type: string}
    Error:
      type: object
      description: The one error shape every failing response returns.
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, in one sentence, safe to show a producer.
          examples: ['gcs_uri is required']
      additionalProperties: false

    Health:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [mock, live]
          description: |
            `mock` serves the planted demo scenario; `live` runs real analysis.
      additionalProperties: false

    Jurisdiction:
      type: object
      required: [code, display_name]
      properties:
        code:
          type: string
          description: The ISO 3166-1 alpha-2 code every `jurisdiction_code` field takes.
          examples: ['AR']
        display_name:
          type: string
          examples: ['Argentina']
      additionalProperties: false

    ProjectCreate:
      type: object
      required: [title, jurisdiction_code]
      properties:
        organization_id:
          type: string
          description: Required in live mode.
        title:
          type: string
          minLength: 1
          examples: ['El Ultimo Verano']
        jurisdiction_code:
          type: string
          description: One of the codes `GET /api/jurisdictions` returns.
          examples: ['AR']
      additionalProperties: false

    Project:
      type: object
      required: [project_id, title, jurisdiction_code, created_at]
      properties:
        project_id:
          type: string
          examples: ['prj-4f2a']
        title:
          type: string
          examples: ['El Ultimo Verano']
        jurisdiction_code:
          type: string
          examples: ['AR']
        created_at:
          type: string
          format: date-time
          description: UTC, seconds precision.
          examples: ['2026-09-05T12:00:00Z']
      additionalProperties: false

    ScriptFile:
      type: object
      description: One uploaded screenplay in Cloud Storage.
      required: [gcs_uri, filename, size_bytes, content_type]
      properties:
        file_id:
          type: string
          description: Owned upload ID; required for live analysis.
        gcs_uri:
          type: string
          description: Pass this to `POST /api/projects/{project_id}/scripts`.
          examples: ['gs://clearcut-scripts/prj-4f2a/el-ultimo-verano-v2.pdf']
        filename:
          type: string
          examples: ['el-ultimo-verano-v2.pdf']
        size_bytes:
          type: integer
          minimum: 1
          examples: [2411553]
        content_type:
          type: string
          enum: [application/pdf]
      additionalProperties: false

    ScriptCreate:
      type: object
      required:
      - jurisdiction_code
      description: Live analysis requires revision_id. Mock mode retains gcs_uri and version.
      properties:
        revision_id:
          type: string
          description: Immutable saved revision in this project; required in live mode.
        file_id:
          type: string
          description: Owned upload ID; required for live analysis.
        gcs_uri:
          type: string
          description: The URI `POST /api/projects/{project_id}/script-files` returned.
          examples: ['gs://clearcut-scripts/prj-4f2a/el-ultimo-verano-v2.pdf']
        version:
          type: integer
          minimum: 1
          description: 1 runs the full pipeline. Above 1 diffs against the stored previous version and
            re-analyzes only the scenes whose content hash changed.
        jurisdiction_code:
          type: string
      additionalProperties: false

    AnalysisState:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - SUCCEEDED
      - FAILED
      - CANCELLED
      description: '`SUCCEEDED` and `FAILED` are terminal: a job in either never moves again, and a later
        run of the same script is a new analysis.'

    AnalysisJob:
      type: object
      required:
      - analysis_id
      - project_id
      - script_id
      - state
      - created_at
      - updated_at
      - error
      - version
      properties:
        analysis_id:
          type: string
        project_id:
          type: string
        script_id:
          type: string
          description: The script version this analysis produces. Assigned when the job is queued, readable
            at `/api/projects/{project_id}/scripts/{script_id}` once `state` is `SUCCEEDED`.
        state:
          $ref: '#/components/schemas/AnalysisState'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When this version was written. Polling compares it to spot a stalled run.
        error:
          type: string
          description: Why the run failed. Empty in every state but `FAILED`, and never empty in `FAILED`.
        version:
          type: integer
          minimum: 1
          description: Each transition writes a new version rather than mutating this row.
      additionalProperties: false

    ActivityEvent:
      type: object
      required:
      - event_id
      - kind
      - occurred_at
      - payload
      properties:
        event_id:
          type: string
        kind:
          type: string
        occurred_at:
          type: string
          format: date-time
        source_version:
          type: integer
        payload:
          type: object

    ScriptSummary:
      type: object
      description: One script version without its scenes or findings.
      required:
        [script_id, project_id, version, gcs_uri, jurisdiction_code, scene_count, finding_count]
      properties:
        script_id:
          type: string
          examples: ['scr-77b1']
        project_id:
          type: string
          examples: ['prj-4f2a']
        version:
          type: integer
          minimum: 1
          examples: [2]
        gcs_uri:
          type: string
          examples: ['gs://clearcut-scripts/prj-4f2a/el-ultimo-verano-v2.pdf']
        jurisdiction_code:
          type: string
          examples: ['AR']
        scene_count:
          type: integer
          minimum: 0
          examples: [84]
        finding_count:
          type: integer
          minimum: 0
          examples: [31]
      additionalProperties: false

    Script:
      type: object
      description: One script version, with every scene and every finding raised against it.
      required:
      - script_id
      - project_id
      - version
      - gcs_uri
      - jurisdiction_code
      - scenes
      - findings
      properties:
        script_id:
          type: string
        project_id:
          type: string
        version:
          type: integer
          minimum: 1
        gcs_uri:
          type: string
          examples: ['gs://clearcut-scripts/prj-4f2a/el-ultimo-verano-v2.pdf']
        jurisdiction_code:
          type: string
        scenes:
          type: array
          description: Ordered by `number`, which strictly increases.
          items:
            $ref: '#/components/schemas/Scene'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
      additionalProperties: false

    Scene:
      type: object
      required: [number, heading, page_start, page_end, text, content_hash, spans]
      properties:
        number:
          type: integer
          minimum: 1
          examples: [12]
        heading:
          type: string
          examples: ['INT. BAR NOTTURNO - NIGHT']
        page_start:
          type: integer
          minimum: 1
          examples: [14]
        page_end:
          type: integer
          minimum: 1
          examples: [15]
        text:
          type: string
          description: The scene as written. `spans` offsets index into this string.
        content_hash:
          type: string
          description: |
            SHA-256 of the normalized text. Two versions share a hash when the
            scene did not change, which is what the delta path joins on.
          examples: ['9f2b1c4e5a6d7f80912a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f80']
        spans:
          type: array
          description: |
            Where in `text` this scene's findings were raised, ordered by
            `start` and never overlapping. Empty when the scene raised none, and
            shorter than the scene's finding count when a finding's `raw_text`
            does not appear verbatim.
          items:
            $ref: '#/components/schemas/Span'
      additionalProperties: false

    Span:
      type: object
      description: |
        One finding's position in one scene's text, computed server-side on
        read (ADR 0015). The browser highlights these offsets and never searches
        the text itself.

        A phrase that appears three times in a scene produces three spans, one
        per occurrence. Where two findings claim the same characters, the
        higher-risk one wins the range and the other has no span here; it is
        still listed among the scene's findings.
      required: [scene_number, start, end, finding_id, risk]
      properties:
        scene_number:
          type: integer
          minimum: 1
          description: The scene this span belongs to, repeated so a span survives being moved.
          examples: [12]
        start:
          type: integer
          minimum: 0
          description: Offset of the first character, counted in Unicode code points.
          examples: [412]
        end:
          type: integer
          minimum: 0
          description: Offset one past the last character. Always greater than `start`.
          examples: [431]
        finding_id:
          type: string
          description: The finding this span belongs to.
          examples: ['EVT-014']
        risk:
          $ref: '#/components/schemas/RiskLevel'
      additionalProperties: false

    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
      description: How urgently a finding needs clearance action.

    Category:
      type: string
      enum:
        - INDUSTRIAL_PROPERTY
        - COPYRIGHT_WORKS
        - PERSONALITY_IMAGE
        - INTEGRATED_VISUAL
        - LOCATIONS_PERMITS
        - SPECIAL_SYMBOLS
        - CONTINUITY
        - POLICY
      description: The eight IP categories a finding falls under.

    NerLabel:
      type: string
      enum:
        - BRAND
        - MUSIC_EXISTING
        - MUSIC_ORIGINAL
        - ART_LIT
        - MEDIA_AV
        - TALENT_CHARACTER
        - REAL_PERSON
        - PROPS_DESIGN
        - LOCATION_PRIV
        - LOCATION_PUB
        - SPECIAL_SYMBOL
      description: The eleven tags the extractor emits.

    Citation:
      type: object
      description: One source backing a finding or an answer.
      required: [uri, title, snippet]
      properties:
        uri:
          type: string
          examples: ['https://servicios.infoleg.gob.ar/infolegInternet/anexos/40000-44999/42755/texact.htm']
        title:
          type: string
          examples: ['Ley 11.723, Regimen Legal de la Propiedad Intelectual']
        snippet:
          type: string
      additionalProperties: false

    Finding:
      type: object
      description: One detected clearance event.
      required:
        - finding_id
        - scene_number
        - page
        - raw_text
        - category
        - ner_label
        - risk_level
        - required_document
        - citations
        - contradicts
      properties:
        finding_id:
          type: string
          examples: ['EVT-014']
        scene_number:
          type: integer
          minimum: 1
          examples: [12]
        page:
          type: integer
          minimum: 1
          examples: [14]
        raw_text:
          type: string
          description: The script fragment the finding was raised against.
          examples: ['a Coca-Cola sign flickers above the bar']
        category:
          $ref: '#/components/schemas/Category'
        ner_label:
          description: |
            Null for `CONTINUITY` and `POLICY` findings: those come from the
            bible audit, so nothing in the script text was extracted for them.
          oneOf:
            - $ref: '#/components/schemas/NerLabel'
            - type: 'null'
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        required_document:
          type: string
          description: What must be obtained to clear this finding.
          examples: ['Trademark Use Authorization']
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        contradicts:
          description: |
            The `fact_id` of the bible fact this finding contradicts, on a
            continuity finding. Null on every other kind.
          type: [string, 'null']
          examples: ['FACT-007']
      additionalProperties: false

    TrackerState:
      type: string
      enum:
      - BLOCKED
      - IN_PROGRESS
      - CLEARED
      description: Where a tracker item stands. Every ordered pair is a legal transition.

    TrackerItem:
      type: object
      description: The actionable side of a finding.
      required:
        - item_id
        - project_id
        - finding_id
        - scene_numbers
        - state
        - needs_review
        - required_document
        - contact
        - litigation_posture
        - draft_email
        - note
        - updated_at
        - version
      properties:
        item_id:
          type: string
        project_id:
          type: string
        finding_id:
          type: string
        scene_numbers:
          type: array
          description: |
            Every scene this item covers. More than one when the same asset was
            deduplicated across scenes.
          minItems: 1
          items:
            type: integer
            minimum: 1
        state:
          $ref: '#/components/schemas/TrackerState'
        needs_review:
          type: boolean
          description: |
            A cleared item whose scene changed in a later version. It is neither
            silently kept nor silently dropped: a producer looks at it again.
        required_document:
          type: string
        contact:
          type: string
          description: The rights holder to reach, as resolved by rights research.
        litigation_posture:
          type: string
          description: What the holder is known to have done about unlicensed use.
        draft_email:
          description: The outreach draft, once `email-drafts` has been posted. Null before that. The
            system never sends it.
          type:
          - string
          - 'null'
        note:
          type: string
          description: |
            Why this item is in the state it is, when a version was written for
            a reason the state alone does not carry. Empty otherwise.
          examples: ['scene 7 removed in version 2']
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Each action writes a new version rather than mutating this row.
          examples: [4]
      additionalProperties: false

    TrackerItemStateUpdate:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/TrackerState'
      additionalProperties: false

    NotificationCreate:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the producer is being told, in one sentence.
      additionalProperties: false

    FactKind:
      type: string
      enum: [LORE, POLICY]
      description: |
        `LORE` facts feed the continuity audit; `POLICY` facts feed the policy
        audit.

    BibleFactCreate:
      type: object
      required: [kind, text, source]
      properties:
        kind:
          $ref: '#/components/schemas/FactKind'
        text:
          type: string
          minLength: 1
          examples: ['Mariana has never left the province.']
        source:
          type: string
          minLength: 1
          description: Where the fact comes from, so a finding that cites it can be checked.
          examples: ['bible.pdf p.4']
      additionalProperties: false

    BibleFact:
      type: object
      required: [fact_id, kind, text, source]
      properties:
        fact_id:
          type: string
          description: Assigned by the server as the next `FACT-NNN` in this project.
          examples: ['FACT-007']
        kind:
          $ref: '#/components/schemas/FactKind'
        text:
          type: string
          examples: ['Mariana has never left the province.']
        source:
          type: string
          examples: ['bible.pdf p.4']
      additionalProperties: false

    ProjectBible:
      type: object
      required: [project_id, facts]
      properties:
        project_id:
          type: string
          examples: ['prj-4f2a']
        facts:
          type: array
          description: Every fact recorded for this project. `fact_id` is unique within it.
          items:
            $ref: '#/components/schemas/BibleFact'
      additionalProperties: false

    QuestionCreate:
      type: object
      required:
      - question
      - jurisdiction_code
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
        jurisdiction_code:
          type: string
          description: The corpus the answer is grounded in.
      additionalProperties: false

    QuestionAnswer:
      type: object
      required:
      - text
      - facts
      - citations
      properties:
        text:
          type: string
          description: The answer.
        facts:
          type: array
          description: The project bible facts the answer drew on. Empty when it drew on none.
          items:
            $ref: '#/components/schemas/BibleFact'
        citations:
          type: array
          description: The legal sources the answer rests on.
          items:
            $ref: '#/components/schemas/Citation'
      additionalProperties: false
                      - text
                      - hardBreak
                    text:
                      type: string
                    marks:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            enum:
                            - bold
                            - italic
    ScreenplayDraft:
      type: object
      required:
      - project_id
      - version
      - document
      - updated_at
      - updated_by
      properties:
        project_id:
          type: string
        version:
          type: integer
          minimum: 0
        document:
          anyOf:
    ScreenplayRevision:
      type: object
      required:
      - revision_id
      - project_id
      - draft_version
      - sha256
      - created_at
      - created_by
      properties:
        revision_id:
          type: string
        project_id:
          type: string
        draft_version:
          type: integer
        sha256:
          type: string
        created_at:
          type: string
        created_by:
          type: string
        document:
            $ref: '#/components/schemas/ScreenplayRevision'
        next_before_version:
          type:
          - integer
          - 'null'
    Transcription:
      type: object
      required:
      - text
      - language
      properties:
        text:
          type: string
        language:
          enum:
          - en-US
          - es-419
          - es-ES
          $ref: '#/components/schemas/ScreenplayDraft'
        original:
