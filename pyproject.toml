[project]
name = "clearcut"
version = "0.1.0"
description = "ClearCut / IP Guardian -- agentic script-clearance engine"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "flask==3.1.3",
  "clickhouse-connect==1.7.2",
  "google-api-core==2.34.0",
  "google-cloud-documentai==3.15.0",
  "google-genai==2.20.0",
  "langchain-google-community[featurestore]==5.0.0",
  "langchain-google-vertexai==3.2.4",
  "parallel-web==1.3.2",
  "httpx==0.28.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# `live` tests reach a real external service. They are deselected by default so
# the loop stays fast and offline; `./.claude/init.sh live` selects them. Without
# `--strict-markers` a typo'd marker silently selects nothing, which is the same
# class of defect the live tier exists to close.
addopts = ["--strict-markers", "-m", "not live"]
markers = [
  "live: reaches a real external service; skipped when its credentials are absent",
]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
# 3.12: numpy >= 2.5 ships PEP 695 stubs that a 3.11 target cannot parse,
# and pytest imports numpy under TYPE_CHECKING. The dev interpreter is 3.12.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
